<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folio Prism · 数据工作台</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">◈</span>
    <div>
      <div class="title">Folio Prism</div>
      <div class="subtitle">数据工作台</div>
    </div>
  </div>
  <nav class="tabs">
    <button class="tab active" data-view="overview">概览</button>
    <button class="tab" data-view="charts">图表</button>
    <button class="tab" data-view="ledger">流水</button>
  </nav>
  <div class="status">
    <span id="as-of" class="muted"></span>
    <button id="refresh-quotes" class="btn ghost">刷新行情</button>
    <button id="download-data" class="btn ghost">下载数据</button>
    <button id="upload-data" class="btn ghost">上传数据</button>
    <button id="upload-apk" class="btn ghost">上传APK</button>
    <input id="upload-file" type="file" accept=".json,application/json" hidden>
    <input id="apk-file" type="file" accept=".apk,application/vnd.android.package-archive" hidden>
  </div>
</header>
<main id="app">
  <div class="loading">正在加载…</div>
</main>
<div id="toast" class="toast hidden"></div>
<div id="modal-root"></div>
<script src="/js/vendor/chart.umd.min.js"></script>
<script src="/js/format.js"></script>
<script src="/js/api.js"></script>
<script src="/js/overview.js"></script>
<script src="/js/charts.js"></script>
<script src="/js/ledger.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
